<style>
  :root{
    --bg:#F4FAF7;
    --surface:#FFFFFF;
    --accent:#00C75D;
    --accent-soft:#E3F9EC;
    --text:#02313D;
    --text-muted:#7C9098;
    --border:#E5EEEA;
    --radius-lg:22px;
    --radius-md:16px;
    --shadow:0 8px 24px rgba(2,49,61,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:transparent;}
  #app{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    padding-bottom:110px;
    position:relative;
  }
  h1,h2,h3,.heading{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:700;}
  .topbar{padding:22px 20px 14px;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .logo-mark{display:flex;flex-shrink:0;line-height:0;}
  .logo-word{font-size:25px;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
  .logo-word .accent{color:var(--accent);}
  .icon-btn{background:var(--surface);border:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;}
  .icon-btn:active{color:#B4444F;}
  .tabs{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:999px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:600;font-size:15px;color:var(--text-muted);cursor:pointer;transition:background .25s ease,color .25s ease;user-select:none;}
  .tab.active{background:var(--accent);color:#fff;}
  main{padding:4px 16px 0;}
  .cat-group{margin-bottom:16px;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);}
  .cat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;}
  .cat-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);}
  .cat-title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:15px;flex:1;color:var(--text);}
  .cat-count{font-size:13px;color:var(--text-muted);font-weight:700;}
  .item-row{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 60px;border-top:1px solid var(--border);}
  .checkbox{width:22px;height:22px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;background:#fff;}
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}
  .checkbox svg{width:13px;height:13px;opacity:0;transition:opacity .15s;}
  .checkbox.checked svg{opacity:1;}
  .item-name{flex:1;font-size:15px;font-weight:600;}
  .item-name.done{text-decoration:line-through;color:var(--text-muted);}
  .item-qty{font-size:13px;color:var(--text-muted);font-weight:700;}
  .item-del{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;}
  .empty-state{text-align:center;padding:60px 30px;color:var(--text-muted);}
  .empty-state .icon-wrap{display:flex;justify-content:center;margin-bottom:14px;color:#C2C7DE;}
  .empty-state p{margin:4px 0;font-size:14px;line-height:1.5;}
  .add-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(2,49,61,0.08);padding:12px 16px calc(14px + env(safe-area-inset-bottom));}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--border);white-space:nowrap;background:var(--surface);color:var(--text);}
  .chip.selected{border-color:var(--accent);background:var(--accent-soft);}
  .input-row{display:flex;gap:8px;}
  .input-row input{flex:1;border:2px solid var(--border);border-radius:14px;padding:12px 14px;font-size:15px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;outline:none;background:var(--bg);color:var(--text);min-width:0;}
  .input-row input:focus{border-color:var(--accent);}
  .btn-add{width:46px;height:46px;border-radius:14px;background:var(--accent);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:10px;}
  .recipe-card{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
  .recipe-photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--accent-soft);display:block;}
  .recipe-photo-placeholder{width:100%;aspect-ratio:1/1;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:#A6ADEE;}
  .recipe-info{padding:10px 12px 14px;}
  .recipe-title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:600;font-size:14px;margin:0 0 4px;line-height:1.3;}
  .recipe-meta{font-size:12px;color:var(--text-muted);font-weight:700;}
  .fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 10px 24px rgba(0,199,93,0.32);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
  .modal-overlay{position:fixed;inset:0;background:rgba(2,49,61,0.35);display:flex;align-items:flex-end;z-index:50;}
  .modal-sheet{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));position:relative;}
  .modal-handle{width:40px;height:5px;background:var(--border);border-radius:99px;margin:0 auto 14px;}
  .modal-title{font-size:20px;margin:0 0 16px;padding-right:30px;}
  .field-label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:600;font-size:13px;color:var(--text-muted);margin:16px 0 6px;}
  .field-label:first-of-type{margin-top:0;}
  .text-input, textarea{width:100%;border:2px solid var(--border);border-radius:14px;padding:12px 14px;font-size:15px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;outline:none;background:var(--surface);color:var(--text);resize:vertical;}
  .text-input:focus, textarea:focus{border-color:var(--accent);}
  .photo-upload{width:100%;aspect-ratio:16/9;border-radius:18px;border:2px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;overflow:hidden;position:relative;gap:8px;}
  .photo-upload img{width:100%;height:100%;object-fit:cover;}
  .ing-row{display:grid;grid-template-columns:1.4fr 0.8fr auto auto;gap:6px;margin-bottom:8px;align-items:center;}
  .ing-row select{border:2px solid var(--border);border-radius:12px;padding:10px 4px;font-size:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--text);width:100%;}
  .ing-row .text-input{padding:10px 10px;font-size:14px;}
  .ing-del{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;width:24px;}
  .link-btn{background:none;border:none;color:var(--accent);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;}
  .primary-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px;}
  .danger-btn{width:100%;background:#FBE9EA;color:#B4444F;border:none;border-radius:14px;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;}
  .close-x{position:absolute;top:14px;right:14px;background:var(--surface);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--text-muted);cursor:pointer;box-shadow:var(--shadow);z-index:2;}
  .detail-photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;margin-bottom:14px;background:var(--accent-soft);}
  .detail-photo-placeholder{width:100%;aspect-ratio:16/10;border-radius:18px;margin-bottom:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:#A6ADEE;}
  .detail-ing-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:14px;}
  .detail-ing-row:first-child{border-top:none;}
  .detail-ing-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);}
  .detail-ing-name{flex:1;font-weight:600;}
  .detail-ing-qty{color:var(--text-muted);font-weight:700;font-size:13px;}
  .instructions{white-space:pre-wrap;line-height:1.6;font-size:14.5px;background:var(--surface);border-radius:16px;padding:14px;margin-top:8px;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,0.2);opacity:0;transition:opacity .25s ease;pointer-events:none;max-width:80%;text-align:center;}
  .toast.show{opacity:1;}
  .section-title{font-size:18px;margin:6px 0 12px;}
</style>

const catById = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1900);

/* Opslag: probeer eerst Claude's ingebouwde opslag; val terug op de opslag
   van de browser zelf als die niet beschikbaar is (bijv. bij openen buiten Claude). */
const hasCloudStorage = () => typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, false);
      return (r && r.value) ? r.value : null;
    }catch(e){ /* val verder terug op lokale opslag hieronder niet nodig, gewoon null */ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasCloudStorage()){
    try{
      const res = await window.storage.set(key, value, false);
      return !!res;
    }catch(e){ return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadData(){
  try{
    const v = await storageGet('shopping-list');
    state.list = v ? JSON.parse(v) : [];
  }catch(e){ state.list = []; }
  try{
    const v = await storageGet('recipes');
    state.recipes = v ? JSON.parse(v) : [];
  }catch(e){ state.recipes = []; }
  render();
}
async function saveList(){
  const ok = await storageSet('shopping-list', JSON.stringify(state.list));
  if(!ok) showToast('Opslaan is niet gelukt, wijziging blijft mogelijk niet bewaard');
}
async function saveRecipes(){
  const ok = await storageSet('recipes', JSON.stringify(state.recipes));
  if(!ok) showToast('Opslaan is niet gelukt, wijziging blijft mogelijk niet bewaard');
}

  app.innerHTML = `

      <div class="brand-row">
        <div class="brand">
          <div class="logo-mark">${LOGO_SVG}</div>

        </div>
        ${state.tab==='lijst' && state.list.length>0 ? `<button class="icon-btn" data-action="clear-list" title="Wis lijst">${iconSvg('trash',18)}</button>` : ''}
      </div>
      <div class="tabs">
        <div class="tab ${state.tab==='lijst'?'active':''}" data-action="tab" data-tab="lijst">Lijst</div>
        <div class="tab ${state.tab==='recepten'?'active':''}" data-action="tab" data-tab="recepten">Recepten</div>
      </div>

    <main>${state.tab==='lijst' ? renderListTab() : renderRecipesTab()}</main>
    ${state.tab==='lijst' ? renderAddBar() : '<button class="fab" data-action="new-recipe">+</button>'}

}

function renderListTab(){
  if(state.list.length === 0){
    return `<div class="empty-state"><div class="icon-wrap">${iconSvg('basket',46)}</div><p>Je lijstje is nog leeg.</p><p>Voeg hieronder een boodschap toe, of zet ingrediënten van een recept op je lijst.</p></div>`;
  }
  let html = '';
  for(const cat of CATEGORIES){
    const items = state.list.filter(i => i.category === cat.id);
    if(items.length === 0) continue;
    const openCount = items.filter(i=>!i.checked).length;
    html += `<div class="cat-group">
      <div class="cat-head">
        <div class="cat-icon">${iconSvg(cat.icon,18)}</div>
        <div class="cat-title">${cat.label}</div>
        <div class="cat-count">${openCount}/${items.length}</div>
      </div>
      ${items.map(i => `
        <div class="item-row">
          <div class="checkbox ${i.checked?'checked':''}" data-action="toggle-item" data-id="${i.id}">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="item-name ${i.checked?'done':''}">${esc(i.name)}</div>
          ${i.qty ? `<div class="item-qty">${esc(i.qty)}</div>` : ''}
          <button class="item-del" data-action="del-item" data-id="${i.id}">✕</button>
        </div>
      `).join('')}
    </div>`;
  }
  return html;
}

function renderAddBar(){
  return `<div class="add-bar">
    <div class="chip-row">
      ${CATEGORIES.map(c => `<div class="chip ${newItemCategory===c.id?'selected':''}" data-action="pick-cat" data-cat="${c.id}">${iconSvg(c.icon,15)} ${c.label}</div>`).join('')}
    </div>
    <div class="input-row">
      <input type="text" id="new-item-name" placeholder="Product toevoegen...">
      <input type="text" id="new-item-qty" placeholder="Aantal" style="max-width:80px;">
      <button class="btn-add" data-action="add-item">+</button>
    </div>
  </div>`;
}

function renderRecipesTab(){
  if(state.recipes.length === 0){
    return `<div class="empty-state"><div class="icon-wrap">${iconSvg('book',46)}</div><p>Nog geen recepten.</p><p>Tik op de + om je eerste recept toe te voegen.</p></div>`;
  }
  return `<div class="recipe-grid">
    ${state.recipes.map(r => `
      <div class="recipe-card" data-action="open-recipe" data-id="${r.id}">
        ${r.photo ? `<img class="recipe-photo" src="${r.photo}">` : `<div class="recipe-photo-placeholder">${iconSvg('plate',32)}</div>`}
        <div class="recipe-info">
          <p class="recipe-title">${esc(r.title)}</p>
          <div class="recipe-meta">${r.ingredients.length} ingrediënten</div>
        </div>

/* ---------- LIST TAB ACTIONS ---------- */
function toggleItem(id){
  const item = state.list.find(i=>i.id===id);
  if(item){ item.checked = !item.checked; saveList(); render(); }
}
function delItem(id){
  state.list = state.list.filter(i=>i.id!==id);
  saveList(); render();
}
function addItemFromBar(){
  const nameEl = document.getElementById('new-item-name');
  const qtyEl = document.getElementById('new-item-qty');
  const name = nameEl.value.trim();
  if(!name) { nameEl.focus(); return; }
  state.list.push({ id: uid(), name, qty: qtyEl.value.trim(), category: newItemCategory, checked:false });
  saveList(); render();
  setTimeout(()=>{ const el = document.getElementById('new-item-name'); if(el) el.focus(); }, 0);
}

/* ---------- MODAL: helpers ---------- */
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

/* ---------- RECIPE FORM ---------- */
function openRecipeForm(existing){
  formState = existing ? { id:existing.id, title:existing.title, photo:existing.photo, instructions:existing.instructions } : { id:null, title:'', photo:null, instructions:'' };
  formIngredients = existing ? existing.ingredients.map(ing => ({ id:uid(), name:ing.name, qty:ing.qty, category:ing.category })) : [{ id:uid(), name:'', qty:'', category:'overig' }];

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" data-action="overlay-close">
      <div class="modal-sheet" data-stop="1">
        <button class="close-x" data-action="close-modal">✕</button>
        <div class="modal-handle"></div>
        <h2 class="modal-title">${existing ? 'Recept bewerken' : 'Nieuw recept'}</h2>

        <div class="field-label">Foto</div>
        <div class="photo-upload" id="photo-box">
          ${formState.photo ? `<img src="${formState.photo}">` : `${iconSvg('camera',30)}<span>Tik om een foto te kiezen</span>`}
        </div>
        <input type="file" id="photo-input" accept="image/*" style="display:none;">

        <div class="field-label">Naam van het gerecht</div>
        <input type="text" class="text-input" id="f-title" placeholder="Bijv. Pompoensoep" value="${esc(formState.title)}">

        <div class="field-label">Ingrediënten</div>
        <div id="ing-rows"></div>
        <button class="link-btn" data-action="add-ing-row">+ Ingrediënt toevoegen</button>

        <div class="field-label">Bereidingswijze</div>
        <textarea id="f-instructions" rows="6" placeholder="Beschrijf de stappen...">${esc(formState.instructions)}</textarea>

        <button class="primary-btn" data-action="save-recipe">Recept opslaan</button>
      </div>
    </div>
  `;
  renderIngRows();
  attachModalHandlers();
}

function renderIngRows(){
  const container = document.getElementById('ing-rows');
  if(!container) return;
  container.innerHTML = formIngredients.map(row => `
    <div class="ing-row" data-row="${row.id}">
      <input type="text" class="text-input" placeholder="Ingrediënt" data-field="name" data-row="${row.id}" value="${esc(row.name)}">
      <input type="text" class="text-input" placeholder="Aantal" data-field="qty" data-row="${row.id}" value="${esc(row.qty)}">
      <select data-field="category" data-row="${row.id}">
        ${CATEGORIES.map(c => `<option value="${c.id}" ${row.category===c.id?'selected':''}>${c.label}</option>`).join('')}
      </select>
      <button class="ing-del" data-action="del-ing-row" data-row="${row.id}">✕</button>
    </div>
  `).join('');
}

function attachModalHandlers(){
  const root = document.getElementById('modal-root');

  // delegated click handler
  root.onclick = (e) => {
    const overlay = e.target.closest('[data-action="overlay-close"]');
    if(overlay && !e.target.closest('[data-stop]')){ closeModal(); return; }
    const closeBtn = e.target.closest('[data-action="close-modal"]');
    if(closeBtn){ closeModal(); return; }
    const photoBox = e.target.closest('#photo-box');
    if(photoBox){ document.getElementById('photo-input').click(); return; }
    const addRow = e.target.closest('[data-action="add-ing-row"]');
    if(addRow){ formIngredients.push({ id:uid(), name:'', qty:'', category:'overig' }); renderIngRows(); return; }
    const delRow = e.target.closest('[data-action="del-ing-row"]');
    if(delRow){
      const rid = delRow.getAttribute('data-row');
      if(formIngredients.length > 1){
        formIngredients = formIngredients.filter(r=>r.id!==rid);
        renderIngRows();
      }
      return;
    }
    const saveBtn = e.target.closest('[data-action="save-recipe"]');
    if(saveBtn){ saveRecipeForm(); return; }
    const delRecipeBtn = e.target.closest('[data-action="delete-recipe"]');
    if(delRecipeBtn){ deleteRecipeConfirm(delRecipeBtn.getAttribute('data-id')); return; }
    const confirmClearEl = e.target.closest('[data-action="confirm-clear-list"]');
    if(confirmClearEl){ clearWholeList(); return; }
    const addToListBtn = e.target.closest('[data-action="add-recipe-to-list"]');
    if(addToListBtn){ addRecipeIngredientsToList(addToListBtn.getAttribute('data-id')); return; }
    const editRecipeBtn = e.target.closest('[data-action="edit-recipe"]');
    if(editRecipeBtn){
      const r = state.recipes.find(x=>x.id===editRecipeBtn.getAttribute('data-id'));
      if(r) openRecipeForm(r);
      return;
    }
  };

  // input/change delegation for ingredient rows
  root.oninput = (e) => {
    const field = e.target.getAttribute('data-field');
    const rowId = e.target.getAttribute('data-row');
    if(field && rowId){
      const row = formIngredients.find(r=>r.id===rowId);
      if(row) row[field] = e.target.value;
    }
  };
  root.onchange = root.oninput;

  const photoInput = document.getElementById('photo-input');
  if(photoInput){
    photoInput.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        formState.photo = reader.result;
        document.getElementById('photo-box').innerHTML = `<img src="${formState.photo}">`;
      };
      reader.readAsDataURL(file);
    };
  }

  const titleEl = document.getElementById('f-title');
  if(titleEl) titleEl.oninput = (e) => { formState.title = e.target.value; };
  const instrEl = document.getElementById('f-instructions');
  if(instrEl) instrEl.oninput = (e) => { formState.instructions = e.target.value; };
}

function saveRecipeForm(){
  const title = (formState.title || '').trim();
  if(!title){ showToast('Geef het recept een naam'); return; }
  const ingredients = formIngredients
    .map(r => ({ name:r.name.trim(), qty:r.qty.trim(), category:r.category }))
    .filter(r => r.name);
  if(ingredients.length === 0){ showToast('Voeg minstens 1 ingrediënt toe'); return; }

  if(formState.id){
    const r = state.recipes.find(x=>x.id===formState.id);
    r.title = title; r.photo = formState.photo; r.instructions = formState.instructions; r.ingredients = ingredients;
  } else {
    state.recipes.push({ id:uid(), title, photo:formState.photo, instructions:formState.instructions, ingredients });
  }
  saveRecipes();
  closeModal();
  render();
  showToast('Recept opgeslagen');
}

/* ---------- RECIPE DETAIL ---------- */
function openRecipeDetail(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" data-action="overlay-close">
      <div class="modal-sheet" data-stop="1">
        <button class="close-x" data-action="close-modal">✕</button>
        ${r.photo ? `<img class="detail-photo" src="${r.photo}">` : `<div class="detail-photo-placeholder">${iconSvg('plate',38)}</div>`}
        <h2 class="modal-title">${esc(r.title)}</h2>

        <div class="field-label">Ingrediënten</div>
        <div>
          ${r.ingredients.map(ing => {
            const c = catById(ing.category);
            return `<div class="detail-ing-row">
              <div class="detail-ing-icon">${iconSvg(c.icon,14)}</div>
              <div class="detail-ing-name">${esc(ing.name)}</div>
              ${ing.qty ? `<div class="detail-ing-qty">${esc(ing.qty)}</div>` : ''}
            </div>`;
          }).join('')}
        </div>

        ${r.instructions ? `<div class="field-label">Bereidingswijze</div><div class="instructions">${esc(r.instructions)}</div>` : ''}

        <button class="primary-btn" data-action="add-recipe-to-list" data-id="${r.id}">Zet ingrediënten op boodschappenlijst</button>
        <button class="link-btn" style="display:block;text-align:center;margin-top:14px;" data-action="edit-recipe" data-id="${r.id}">Recept bewerken</button>
        <button class="danger-btn" data-action="delete-recipe" data-id="${r.id}">Recept verwijderen</button>
      </div>
    </div>
  `;
  attachModalHandlers();
}

function addRecipeIngredientsToList(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  let added = 0;
  for(const ing of r.ingredients){
    const exists = state.list.some(i => !i.checked && i.name.toLowerCase()===ing.name.toLowerCase() && i.category===ing.category);
    if(!exists){
      state.list.push({ id:uid(), name:ing.name, qty:ing.qty, category:ing.category, checked:false });
      added++;
    }
  }
  saveList();
  closeModal();
  state.tab = 'lijst';
  render();
  showToast(added > 0 ? `${added} ingrediënten toegevoegd aan je lijstje` : 'Ingrediënten stonden al op je lijstje');
}

function deleteRecipeConfirm(id){
  state.recipes = state.recipes.filter(r=>r.id!==id);
  saveRecipes();
  closeModal();
  render();
  showToast('Recept verwijderd');
}

/* ---------- CLEAR WHOLE LIST ---------- */
function openClearListConfirm(){
  const root = document.getElementById('modal-root');
  const count = state.list.length;
  root.innerHTML = `
    <div class="modal-overlay" data-action="overlay-close">
      <div class="modal-sheet" data-stop="1">
        <div class="modal-handle"></div>
        <h2 class="modal-title" style="margin-bottom:8px;">Hele lijst wissen?</h2>
        <p style="color:var(--text-muted);font-size:14px;margin:0;line-height:1.5;">Dit verwijdert alle ${count} boodschap${count===1?'':'pen'} van je lijstje. Dit kan niet ongedaan gemaakt worden.</p>
        <button class="danger-btn" data-action="confirm-clear-list" style="margin-top:18px;">Ja, wis de hele lijst</button>
        <button class="link-btn" data-action="close-modal" style="display:block;width:100%;text-align:center;">Annuleren</button>
      </div>
    </div>
  `;
  attachModalHandlers();
}
function clearWholeList(){
  state.list = [];
  saveList();
  closeModal();
  render();
  showToast('Lijst gewist');
}

/* ---------- GLOBAL CLICK DELEGATION (main app) ---------- */
document.getElementById('app').addEventListener('click', (e) => {
  const tabEl = e.target.closest('[data-action="tab"]');
  if(tabEl){ state.tab = tabEl.getAttribute('data-tab'); render(); return; }

  const clearListEl = e.target.closest('[data-action="clear-list"]');
  if(clearListEl){ openClearListConfirm(); return; }

  const toggleEl = e.target.closest('[data-action="toggle-item"]');
  if(toggleEl){ toggleItem(toggleEl.getAttribute('data-id')); return; }

  const delEl = e.target.closest('[data-action="del-item"]');
  if(delEl){ delItem(delEl.getAttribute('data-id')); return; }

  const pickCatEl = e.target.closest('[data-action="pick-cat"]');
  if(pickCatEl){ newItemCategory = pickCatEl.getAttribute('data-cat'); render(); return; }

  const addItemEl = e.target.closest('[data-action="add-item"]');
  if(addItemEl){ addItemFromBar(); return; }

  const newRecipeEl = e.target.closest('[data-action="new-recipe"]');
  if(newRecipeEl){ openRecipeForm(null); return; }

  const openRecipeEl = e.target.closest('[data-action="open-recipe"]');
  if(openRecipeEl){ openRecipeDetail(openRecipeEl.getAttribute('data-id')); return; }
});

document.getElementById('app').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.target.id === 'new-item-name' || e.target.id === 'new-item-qty')){
    addItemFromBar();
  }
});

function showFatalError(err){
  document.getElementById('app').innerHTML =
    '<div class="empty-state"><span class="emoji">⚠️</span><p><strong>Er ging iets mis bij het laden.</strong></p><p style="font-size:12px;word-break:break-word;">' + esc(String(err && err.message ? err.message : err)) + '</p></div>';
}
window.addEventListener('error', (e) => showFatalError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showFatalError(e.reason));

try{
  render();
  loadData();
}catch(err){ showFatalError(err); }
</script>
</body>
</html>
